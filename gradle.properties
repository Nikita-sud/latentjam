# The Gradle daemon is disabled deliberately: this development machine hits a
# macOS TCC sandbox issue with long-lived daemons. Configuration cache + build
# cache below offset the cold-start cost. CI disables the daemon anyway.
org.gradle.daemon=false
# Kotlin/Native Release LTO exceeds 2 GiB while linking the Compose + ONNX framework. Four GiB is
# still bounded for local/CI builds and prevents otherwise valid iOS releases from dying in the
# devirtualization pass.
org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx8192m
# The Kotlin/Native release compile of the whole app framework needs more than the default.
kotlin.native.jvmArgs=-Xmx8192m
org.gradle.configuration-cache=true
org.gradle.caching=true

android.useAndroidX=true
kotlin.code.style=official
# A Linux build host (F-Droid) cannot build the iOS targets; this keeps that a silent skip.
kotlin.native.ignoreDisabledTargets=true
