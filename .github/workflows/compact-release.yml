name: Verify compact Android release
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "androidApp/**"
      - "tools/runtime/**"
      - "tools/ci/apk_inventory.py"
      - "core/ort-ops/**"
      - "core/audio-dsp/**"
      - "core/map-native/**"
      - "core/smart/build.gradle.kts"
      - "composeApp/build.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "build-logic/**"
      - ".github/workflows/compact-release.yml"
permissions:
  contents: read
concurrency:
  group: compact-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compact:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: android-actions/setup-android@v3
      - name: Install native build tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platforms;android-34" "build-tools;30.0.3" "ndk;28.2.13676358" "cmake;3.22.1"
          python -m pip install cmake ninja
      - name: Read the application's runtime version
        run: |
          python -c 'import os,tomllib; v=tomllib.load(open("gradle/libs.versions.toml","rb"))["versions"]["onnxruntime"]; print("ORT_VERSION="+v, file=open(os.environ["GITHUB_ENV"],"a"))'
      - name: Build a model-matched reduced ARM64 runtime
        run: |
          python -m pip install "onnxruntime==$ORT_VERSION" onnx numpy
          git clone --depth 1 --branch "v$ORT_VERSION" --recursive --shallow-submodules https://github.com/microsoft/onnxruntime.git "$RUNNER_TEMP/ort-source"
          curl --fail --location --retry 3 "https://repo.maven.apache.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/$ORT_VERSION/onnxruntime-android-$ORT_VERSION.aar" -o "$RUNNER_TEMP/onnxruntime-android-$ORT_VERSION.aar"
          cmake -S core/ort-ops/src/main/cpp -B "$RUNNER_TEMP/ljq4-host" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/ljq4-host" --parallel 2
          python tools/runtime/build_reduced_ort.py --source "$RUNNER_TEMP/ort-source" --output "$RUNNER_TEMP/reduced-ort" --sdk "$ANDROID_HOME" --ndk "$ANDROID_HOME/ndk/28.2.13676358" --stock-aar "$RUNNER_TEMP/onnxruntime-android-$ORT_VERSION.aar" --custom-op-library "$RUNNER_TEMP/ljq4-host/libljq4.so" --jobs 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify exact packaged runtime, DEX and all split ABIs
        run: |
          python tools/runtime/build_compact_release.py --reduced-repo "$RUNNER_TEMP/reduced-ort/maven" --stock-aar "$RUNNER_TEMP/onnxruntime-android-$ORT_VERSION.aar" --strip-tool "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-release-verification
          path: |
            build/reports/compact-release/
            androidApp/build/reports/dex-registers/
            ${{ runner.temp }}/reduced-ort/maven/manifest.json
          retention-days: 14
